# CI：PRと、main へのpushのときに、テストと検査を動かす。
# 内容は docs/development/testing.md の「CI」。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Python：書き方の検査（ruff）と、テスト（pytest。モデルとmigrationのずれを含む）
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest

  # JavaScript：書き方の検査（ESLint）
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 画面のE2Eテスト（Playwright。ブラウザは Chromium）。Bootstrap・
  # FullCalendarは、アプリと同じく、CDNから読み込む
  e2e:
    runs-on: ubuntu-latest
    # ブラウザが止まったときに、長く動き続けないように
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Chromiumと、動かすのに必要なOSのパッケージを入れる
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e
