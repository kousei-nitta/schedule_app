# CI：PRと、main へのpushのときに、テストと検査を動かす。
# 内容は docs/development/testing.md の「CI」。
#
# アクションは、タグ（v7 など）でなく、コミットのSHAで固定する（タグは
# あとから別のコミットに付け替えられるため。docs/architecture/security.md
# の「CI」）。版は、行の末尾のコメントに書く。更新は Dependabot が、
# 公開から14日たった版で、PRを出す（.github/dependabot.yml）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Python：書き方の検査（ruff）と、テスト（pytest。モデルとmigrationのずれを含む）
  python:
    runs-on: ubuntu-latest
    # 止まったときに、長く動き続けないように
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # その系列の、最新の修正版を使う（ランナーに入っている版が古い
          # ことがあるため）
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # pip を、eMudhra の件（侵害された中間CA）に対応した版にしてから使う
      # （docs/architecture/security.md の「開発の環境」）
      - run: python -m pip install pip==26.2.2
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest

  # JavaScript：書き方の検査（ESLint）
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      # .npmrc の ignore-scripts=true で、インストールのときのスクリプトは
      # 動かさない
      - run: npm ci
      - run: npm run lint

  # 画面のE2Eテスト（Playwright。ブラウザは Chromium）。Bootstrap・
  # FullCalendarは、アプリと同じく、CDNから読み込む
  e2e:
    runs-on: ubuntu-latest
    # ブラウザが止まったときに、長く動き続けないように
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install pip==26.2.2
      - run: pip install -r requirements-dev.txt
      # Chromiumと、動かすのに必要なOSのパッケージを入れる
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m e2e
